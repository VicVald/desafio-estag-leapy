version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: leapy_pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-leapy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  directus:
    image: directus/directus:10
    container_name: leapy_directus
    depends_on:
      - postgres
    ports:
      - "${PORT:-8055}:8055"
    environment:
      KEY: ${KEY:-supersecretkey}
      SECRET: ${SECRET:-supersecretsecret}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-leapy}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DIRECTUS_EXPERIMENTAL_GRAPHQL_INTROSPECTION: "true"
      EXTENSIONS_AUTO_RELOAD: "true"
    volumes:
      - ./extensions:/directus/extensions

  frontend:
    build: ../interface-talent
    container_name: leapy_frontend
    depends_on:
      - directus
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-http://directus:8055}

  seeder:
    image: postgres:15
    container_name: leapy_seeder
    depends_on:
      - postgres
      - directus
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-leapy}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - ./seed:/seed:ro
    command: >
      sh -c "
      apt-get update && apt-get install -y curl jq &&
      until pg_isready -h postgres -p 5432 -U postgres; do echo 'Waiting for postgres...'; sleep 2; done &&
      until curl -f http://directus:8055/server/health; do echo 'Waiting for directus...'; sleep 2; done &&
      TOKEN=$(curl -s -X POST http://directus:8055/auth/login -H 'Content-Type: application/json' -d '{\"email\":\"'${ADMIN_EMAIL}'\",\"password\":\"'${ADMIN_PASSWORD}'\"}' | jq -r .data.access_token) &&
      for i in {1..20}; do
        curl -s -X POST http://directus:8055/users -H 'Authorization: Bearer '$TOKEN -H 'Content-Type: application/json' -d '{\"email\":\"leader'$i'@example.com\",\"password\":\"password\"}'
      done &&
      for i in {1..100}; do
        curl -s -X POST http://directus:8055/users -H 'Authorization: Bearer '$TOKEN -H 'Content-Type: application/json' -d '{\"email\":\"talent'$i'@example.com\",\"password\":\"password\"}'
      done &&
      psql -h postgres -U postgres -d leapy -f /seed/schema.sql &&
      psql -h postgres -U postgres -d leapy -f /seed/seed.sql &&
      echo 'Seeding completed successfully'
      "
    restart: "no"

volumes:
  pg_data:
